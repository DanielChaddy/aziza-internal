# CI on GitHub-hosted runners: the two halves of `make check`, as two independent jobs.
#
# The split is a credential boundary. ruff installs standalone, so `quality` never resolves this
# project's dependencies and needs no secret; `test` installs requirements.txt, whose platform
# packages come from a private Azure DevOps repository and therefore does.
name: CI

on:
  push:
    branches: [main]
  # Branch protection requires Quality and Test on a pull request, and a workflow that only
  # triggers on push can never report them — so every PR blocks. `image` and `deploy` are guarded
  # on `refs/heads/main`, which a pull_request event never matches, so neither runs here.
  pull_request:
    branches: [main]
  # Weekly, because what a run resolves moves without a commit here: the agent-platform tags
  # requirements.txt installs from, and the runner image.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      # Both halves, for the reason the Makefile gives.
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # tests/conftest.py reads this: an absent database is a failure rather than a green run
      # full of skips.
      REQUIRE_DB: '1'
      # The suite derives dates in Python and reads timestamps back through a session pinned to
      # the salon's timezone (aziza_adk/queries.py); a UTC runner puts the two a day apart for
      # four hours out of every twenty-four.
      TZ: America/Santo_Domingo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pip clones the private pins with git, so the credential belongs to git rather than to pip.
      # URL-scoped, so it reaches no other host. The header is derived from the secret rather than
      # equal to it, which is why it is masked by hand.
      - name: Credential for the private platform pins
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          PLATFORM_URL: https://dev.azure.com/mdtx/Assistants/_git/agent-platform
        run: |
          set -euo pipefail
          header="$(printf ':%s' "$ADO_PAT" | base64 -w0)"
          echo "::add-mask::$header"
          git config --global "http.${PLATFORM_URL}.extraheader" "AUTHORIZATION: basic $header"

      # --wait blocks on the healthcheck docker-compose.yml declares, so the seed cannot race the
      # server. The default DATABASE_URL already names the port it publishes.
      - name: Postgres
        run: docker compose up -d --wait db

      - run: pip install -r requirements.txt

      # Idempotent, and re-runnable. README § Run it.
      - run: python scripts/seed_catalog.py

      # pytest exits 5 on an empty collection, so a suite that silently stops being discovered
      # fails this job rather than reporting green.
      - run: python -m pytest

  image:
    name: Image
    needs: [quality, test]
    # A dispatched run on a branch would otherwise publish a tag that traces to no released
    # commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN, so publishing needs no credential of its own.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag is the short commit SHA and nothing else. It has to be derivable from a git ref by
      # anyone holding the repository, or a rollback names an image nobody can rebuild — which is
      # also why no `latest` is published.
      #
      # ADO_PAT reaches pip as a BuildKit secret, read out of /run/secrets while pip runs and
      # never written into a layer (Dockerfile).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/danielchaddy/aziza-internal:${{ steps.sha.outputs.short }}
          # Links the GHCR package to this repository, which is what makes the package inherit
          # its visibility rather than defaulting to public.
          labels: org.opencontainers.image.source=https://github.com/DanielChaddy/aziza-internal
          secrets: |
            ADO_PAT=${{ secrets.ADO_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    # Skipped until the cluster prerequisites exist — deploy/helm/README.md § Prerequisites. A
    # repository VARIABLE rather than a secret, because it is an on-switch and not a credential:
    # without it a push to a half-provisioned cluster would fail every run and teach everyone to
    # ignore a red build.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NAMESPACE: z-aziza
      RELEASE: aziza
      # Selected by name rather than taken from the kubeconfig's current-context: this account has
      # more than one cluster, and deploying to the wrong one would succeed.
      KUBE_CONTEXT: do-sfo2-k8s-1-33-1-do-3-sfo2-1755028278626
    steps:
      - uses: actions/checkout@v4

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # From Helm's own release rather than a marketplace action: one less publisher to trust for
      # the step that holds cluster credentials.
      - name: Install helm
        run: |
          set -euo pipefail
          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install -m0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Cluster credentials
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          install -m0700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      # --atomic rolls the release back if it does not become ready, so a bad image leaves the
      # previous one serving rather than a half-applied release. The Secret and the pull secret are
      # NOT created here: they are out-of-band prerequisites, so this job holds no app credential.
      - name: helm upgrade --install
        run: |
          set -euo pipefail
          helm --kube-context "$KUBE_CONTEXT" -n "$NAMESPACE" \
            upgrade --install "$RELEASE" deploy/helm/aziza \
            --set image.tag=${{ steps.sha.outputs.short }} \
            --atomic --timeout 10m

      - name: What is running
        run: |
          helm --kube-context "$KUBE_CONTEXT" -n "$NAMESPACE" history "$RELEASE" | tail -3
