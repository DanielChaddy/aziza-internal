apiVersion: v1
kind: Service
metadata:
  name: {{ include "aziza.fullname" . }}
  labels:
    {{- include "aziza.labels" . | nindent 4 }}
spec:
  # ClusterIP is hardcoded, not a value: a configurable service.type invites a LoadBalancer or
  # NodePort, which would reach the pod directly and bypass the ingress path allowlist — and
  # /simulate authenticates nobody.
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aziza.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aziza.fullname" . }}-headless
  labels:
    {{- include "aziza.labels" . | nindent 4 }}
spec:
  # Required by the StatefulSet's spec.serviceName. Not used for routing.
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "aziza.selectorLabels" . | nindent 4 }}
