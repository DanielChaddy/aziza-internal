{{/*
Where `existingSecret` comes from.

The chart still renders NO credential — this declares a path and an identity, and External
Secrets performs the read — so `helm template` and `helm get manifest` stay safe to paste.

A NAMESPACED SecretStore naming this release's own ServiceAccount, never a ClusterSecretStore.
The token OpenBao sees then belongs to this app and the policy behind it reaches one mount; a
ClusterSecretStore would authenticate as the External Secrets controller instead, which is
granted no role at all so that it cannot become a key to every mount on the server.
*/}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    {{- include "aziza.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.openbao.authMount | quote }}
          role: {{ .Values.openbao.role | quote }}
          serviceAccountRef:
            name: {{ include "aziza.fullname" . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.existingSecret }}
  labels:
    {{- include "aziza.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.openbao.refreshInterval | quote }}
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    # ONE value names the Secret here and in every secretKeyRef in this chart, so the reader and
    # the writer cannot drift apart into a reference nothing resolves.
    name: {{ .Values.existingSecret }}
  dataFrom:
    # Every key stored at this path lands in the Secret under its own name, which is what makes
    # adding a credential a `bao kv put` rather than a chart change.
    - extract:
        key: {{ .Values.openbao.key | quote }}
