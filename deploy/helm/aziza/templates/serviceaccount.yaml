apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aziza.fullname" . }}
  labels:
    {{- include "aziza.labels" . | nindent 4 }}
# Nothing here calls the Kubernetes API, and the webhook is exposed to unauthenticated internet
# traffic — so don't hand it a token it can only ever leak.
automountServiceAccountToken: false
imagePullSecrets:
  {{- toYaml .Values.imagePullSecrets | nindent 2 }}
