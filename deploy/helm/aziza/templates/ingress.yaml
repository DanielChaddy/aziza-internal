apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aziza.fullname" . }}
  labels:
    {{- include "aziza.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    # A turn is capped at MODEL_TURN_TIMEOUT_SECONDS (60s) and Telegram's delivery POST waits on
    # the 200, so the default 60s proxy timeout sits exactly on the app's own ceiling.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # A voice note is fetched by the service from Telegram rather than posted to it, so the
    # largest inbound body is the join form.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "aziza.tlsSecretName" . }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # An ALLOWLIST, and deliberately no catch-all: an unlisted route has no backend, so
          # anything added later is unreachable from the internet by default rather than exposed
          # until someone remembers to deny it. /simulate is the route that must stay off it —
          # it runs a turn as any sender it is given (README § Run it).
          #
          # /j is the ONLY entry the internet reaches with no credential of any kind: a join
          # token proves presence, not a person (docs/PROJECT_DEFINITION.md §13). /mini-app is
          # gated on Telegram's signed initData, except its shell and script, which carry no
          # salon data because they cannot be gated (§14).
          {{- range list "/webhook" "/healthz" "/health" "/j" "/mini-app" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "aziza.fullname" $ }}
                port:
                  name: http
          {{- end }}
