{{- if .Values.dbBuild.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Revision-suffixed because a Job's spec.template is immutable — a fixed name would make the next
  # `helm upgrade` fail instead of creating a new Job.
  name: {{ include "aziza.fullname" . }}-dbbuild-{{ .Release.Revision }}
  labels:
    {{- include "aziza.labels" . | nindent 4 }}
spec:
  # A half-applied build retried is worse than a visible failure.
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        {{- include "aziza.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "aziza.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dbbuild
          # The APP image, not a postgres one: the bootstrap is Python, not SQL.
          # seed_catalog.py calls queries.apply_schema itself, so there is no psql to need and
          # no out-of-band ConfigMap to carry the SQL.
          #
          # It loads the salon's REAL catalog and, alongside it, three INVENTED specialists
          # (aziza_adk/demo_data.py) — nobody real can drive the assistant until the salon's own
          # are registered. deploy/helm/README.md § Building the database.
          image: {{ include "aziza.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
            - name: TIMEZONE
              value: {{ .Values.config.TIMEZONE | quote }}
          command: ["python", "scripts/seed_catalog.py"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
          resources:
            {{- toYaml .Values.dbBuild.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
{{- end }}
