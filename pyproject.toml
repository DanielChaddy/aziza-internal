# Tool configuration only. This repository is an application run from its root, not a
# distribution — no [project] and no [build-system], so nothing here is installable by
# accident. requirements.txt is the dependency manifest.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
# The platform packages are third-party pip installs here, not src/ layout locals.
known-first-party = ["aziza_adk", "conftest", "eval", "scripts", "voice_checks"]

[tool.pytest.ini_options]
# Explicit so a bare `pytest` collects the same set here and in the pipeline.
testpaths = ["tests"]
